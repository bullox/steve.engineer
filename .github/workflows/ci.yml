name: ci

on:
  push:
    branches: [master, redesign-astro]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    name: Type-check and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Astro check
        run: npx astro check

      - name: Run Astro build
        run: npm run build
